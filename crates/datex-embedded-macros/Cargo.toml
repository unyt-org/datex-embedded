[package]
name = "datex-embedded-macros"
version = "0.0.1"
edition = "2024"
license-file = "../../LICENSE"
description = "Macros for datex-embedded"

[lib]
proc-macro = true

[dependencies]
cfg-if = "1.0.4"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

datex-core = { version = "0.0.15", default-features = false, features = [
	"target_native",
] }
datex-macro-utils = { version = "0.0.3", default-features = false }

[features]
target_esp32 = []
target_esp32s3 = []
target_esp32c2 = []
